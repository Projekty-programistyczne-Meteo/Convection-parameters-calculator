name: Deploy to (dev branch) GitHub Pages

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  full-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/cpc/package-lock.json

      - name: Install dependencies
        working-directory: app/cpc
        run: npm ci

      - name: Build
        working-directory: app/cpc
        run: npm run build

      - name: Run component tests
        working-directory: app/cpc/tests
        run: npx cypress run --component

      - name: Start app in background
        working-directory: app/cpc
        run: npm run dev -- --host 0.0.0.0 &

      - name: Wait for app to be ready
        working-directory: app/cpc
        run: npx wait-on http://127.0.0.1:5173

      - name: Run E2E tests
        working-directory: app/cpc/tests
        run: npx cypress run --e2e

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/cpc/dist

  deploy:
    needs: full-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
